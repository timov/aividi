services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: aividi
      POSTGRES_PASSWORD: aividi
      POSTGRES_DB: aividi
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aividi -d aividi']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  db-data:
  redis-data:
